[project]
name = "rentscout-backend"
version = "0.1.0"
description = "RentScout API (FastAPI + SQLAlchemy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
