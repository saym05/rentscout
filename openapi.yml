openapi: 3.0.3
info:
  title: RentScout API
  version: 0.1.0
  description: >
    Contract between the RentScout frontend and backend. Written BEFORE the backend exists
    (iteration 2); the backend must implement exactly these endpoints.
    Favorites are scoped to a demo user taken from the optional X-Demo-User header (default "demo").
    This is NOT authentication.
servers:
  - url: http://localhost:8091
tags:
  - name: listings
  - name: favorites
  - name: compare
  - name: sources
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/listings:
    get:
      operationId: searchListings
      tags: [listings]
      summary: Search, filter, sort and paginate listings
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: city, in: query, schema: { type: string } }
        - { name: neighborhood, in: query, schema: { type: string } }
        - { name: minPrice, in: query, description: Monthly cost in the display currency, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: minRooms, in: query, schema: { type: integer, minimum: 1 } }
        - { name: maxRooms, in: query, schema: { type: integer, minimum: 1 } }
        - name: propertyTypes
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/PropertyType" } }
        - name: amenities
          in: query
          description: Listing must have ALL given amenities
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/Amenity" } }
        - { name: sort, in: query, schema: { type: string, enum: [price_asc, price_desc, newest], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: currency, in: query, description: Display currency, schema: { $ref: "#/components/schemas/Currency" } }
        - { name: X-Demo-User, in: header, description: Demo user for isFavorite (not authentication), schema: { type: string, default: demo } }
      responses:
        "200":
          description: A page of listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a manual listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingView" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/listings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getListing
      tags: [listings]
      summary: Listing detail with probable-duplicate candidates
      parameters:
        - { name: currency, in: query, schema: { $ref: "#/components/schemas/Currency" } }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateListing
      tags: [listings]
      summary: Partially update a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingView" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteListing
      tags: [listings]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      parameters:
        - { name: currency, in: query, schema: { $ref: "#/components/schemas/Currency" } }
        - { name: X-Demo-User, in: header, schema: { type: string, default: demo } }
      responses:
        "200":
          description: Saved listings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ListingView" } }
  /api/favorites/{listing_id}:
    parameters:
      - { name: listing_id, in: path, required: true, schema: { type: string } }
      - { name: X-Demo-User, in: header, schema: { type: string, default: demo } }
    post:
      operationId: addFavorite
      tags: [favorites]
      responses:
        "204": { description: Saved (idempotent) }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeFavorite
      tags: [favorites]
      responses:
        "204": { description: "Removed (idempotent, also when it was not saved)" }
  /api/compare:
    post:
      operationId: compareListings
      tags: [compare]
      summary: Side-by-side comparison of 2 to 3 listings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompareRequest" }
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sources:
    get:
      operationId: listSources
      tags: [sources]
      responses:
        "200":
          description: Source availability
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceStatus" } }
  /api/sources/refresh:
    post:
      operationId: refreshSources
      tags: [sources]
      summary: Run every source adapter; one failing source never removes stored listings
      responses:
        "200":
          description: Per-source outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResult" }
        "409":
          description: A refresh is already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok] } }
    Currency: { type: string, enum: [EUR, GBP, CAD, USD] }
    PropertyType: { type: string, enum: [studio, apartment, room, house] }
    Amenity: { type: string, enum: [furnished, wifi, washer, dishwasher, balcony, parking, gym, pets-allowed, elevator] }
    RentPeriod: { type: string, enum: [month, week] }
    Listing:
      type: object
      required: [id, title, description, city, neighborhood, propertyType, rooms, areaSqm, rentAmount, rentPeriod, currency, utilitiesIncluded, utilitiesMonthly, amenities, sourceId, externalId, sourceUrl, isDemo, firstSeenAt, lastSeenAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        neighborhood: { type: string }
        propertyType: { $ref: "#/components/schemas/PropertyType" }
        rooms: { type: integer, minimum: 1, maximum: 20 }
        areaSqm: { type: number, nullable: true }
        rentAmount: { type: number, exclusiveMinimum: true, minimum: 0, description: Original amount in original currency and period }
        rentPeriod: { $ref: "#/components/schemas/RentPeriod" }
        currency: { $ref: "#/components/schemas/Currency" }
        utilitiesIncluded: { type: boolean }
        utilitiesMonthly: { type: number, nullable: true, minimum: 0, description: null means unknown }
        amenities: { type: array, items: { $ref: "#/components/schemas/Amenity" } }
        sourceId: { type: string }
        externalId: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        isDemo: { type: boolean, description: true for demonstration data }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ListingInput:
      type: object
      required: [title, city, neighborhood, propertyType, rooms, rentAmount, rentPeriod, currency]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        city: { type: string, minLength: 1 }
        neighborhood: { type: string, minLength: 1 }
        propertyType: { $ref: "#/components/schemas/PropertyType" }
        rooms: { type: integer, minimum: 1, maximum: 20 }
        areaSqm: { type: number, nullable: true }
        rentAmount: { type: number, exclusiveMinimum: true, minimum: 0 }
        rentPeriod: { $ref: "#/components/schemas/RentPeriod" }
        currency: { $ref: "#/components/schemas/Currency" }
        utilitiesIncluded: { type: boolean }
        utilitiesMonthly: { type: number, nullable: true, minimum: 0 }
        amenities: { type: array, items: { $ref: "#/components/schemas/Amenity" } }
        sourceUrl: { type: string, nullable: true }
    ListingPatch:
      type: object
      description: Any subset of ListingInput fields
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        city: { type: string, minLength: 1 }
        neighborhood: { type: string, minLength: 1 }
        propertyType: { $ref: "#/components/schemas/PropertyType" }
        rooms: { type: integer, minimum: 1, maximum: 20 }
        areaSqm: { type: number, nullable: true }
        rentAmount: { type: number, exclusiveMinimum: true, minimum: 0 }
        rentPeriod: { $ref: "#/components/schemas/RentPeriod" }
        currency: { $ref: "#/components/schemas/Currency" }
        utilitiesIncluded: { type: boolean }
        utilitiesMonthly: { type: number, nullable: true, minimum: 0 }
        amenities: { type: array, items: { $ref: "#/components/schemas/Amenity" } }
        sourceUrl: { type: string, nullable: true }
    MonthlyCost:
      type: object
      required: [amount, currency, converted, native, rentMonthly, utilitiesMonthly, utilitiesKnown]
      properties:
        amount: { type: number }
        currency: { $ref: "#/components/schemas/Currency" }
        converted: { type: boolean, description: true when currency differs from the original }
        rate: { type: number, nullable: true, description: null or absent when not converted }
        rateAsOf: { type: string, format: date-time, nullable: true }
        rateSource: { type: string, nullable: true, description: Where the rate came from; demo rates say so }
        native:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: number }
            currency: { $ref: "#/components/schemas/Currency" }
        rentMonthly: { type: number }
        utilitiesMonthly: { type: number }
        utilitiesKnown: { type: boolean }
    ListingView:
      type: object
      required: [listing, monthlyCost, isFavorite]
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        monthlyCost:
          allOf: [{ $ref: "#/components/schemas/MonthlyCost" }]
          nullable: true
          description: null when it cannot be expressed in the display currency without a rate
        isFavorite: { type: boolean }
    DuplicateMatch:
      type: object
      required: [listingId, score, category, reasons]
      properties:
        listingId: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        category: { type: string, enum: [probable, possible, none] }
        reasons: { type: array, items: { type: string } }
    ListingDetail:
      allOf:
        - { $ref: "#/components/schemas/ListingView" }
        - type: object
          required: [duplicates]
          properties:
            duplicates: { type: array, items: { $ref: "#/components/schemas/DuplicateMatch" } }
    SearchResult:
      type: object
      required: [items, total, page, pageSize, currency]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ListingView" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        currency: { $ref: "#/components/schemas/Currency" }
    CompareRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 2, maxItems: 3, uniqueItems: true, items: { type: string } }
        currency: { $ref: "#/components/schemas/Currency" }
    ComparisonResult:
      type: object
      required: [currency, items, cheapestId, amenityMatrix]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        items: { type: array, items: { $ref: "#/components/schemas/ListingView" } }
        cheapestId: { type: string, nullable: true }
        amenityMatrix:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    SourceStatus:
      type: object
      required: [id, name, kind, status, lastCheckedAt, lastSuccessAt, listingCount, error]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [demo, live] }
        status: { type: string, enum: [ok, failed, never_run] }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        listingCount: { type: integer }
        error: { type: string, nullable: true }
    RefreshResult:
      type: object
      required: [startedAt, finishedAt, outcomes]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        outcomes:
          type: array
          items:
            type: object
            required: [sourceId, ok, fetched, error]
            properties:
              sourceId: { type: string }
              ok: { type: boolean }
              fetched: { type: integer }
              error: { type: string, nullable: true }
    FieldError:
      type: object
      required: [field, message]
      properties: { field: { type: string }, message: { type: string } }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
